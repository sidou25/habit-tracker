<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker · Admin</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Caveat:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <!-- Motif zellige (même frise que le tableau) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="zellige" width="36" height="36" patternUnits="userSpaceOnUse">
        <rect width="36" height="36" fill="var(--z-bg)"/>
        <g transform="translate(18 18)">
          <rect x="-8" y="-8" width="16" height="16" fill="var(--z1)"/>
          <rect x="-8" y="-8" width="16" height="16" fill="var(--z1)" transform="rotate(45)"/>
          <rect x="-4.5" y="-4.5" width="9" height="9" fill="var(--z-bg)" transform="rotate(22.5)"/>
          <circle r="2.6" fill="var(--z4)"/>
        </g>
        <g fill="var(--z2)">
          <path d="M0 -6 6 0 0 6 -6 0Z"/>
          <path d="M36 -6 42 0 36 6 30 0Z"/>
          <path d="M0 30 6 36 0 42 -6 36Z"/>
          <path d="M36 30 42 36 36 42 30 36Z"/>
        </g>
        <g fill="var(--z3)">
          <path d="M18 -3 21 0 18 3 15 0Z"/>
          <path d="M18 33 21 36 18 39 15 36Z"/>
          <path d="M0 15 3 18 0 21 -3 18Z"/>
          <path d="M36 15 39 18 36 21 33 18Z"/>
        </g>
      </pattern>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand">Habit <span class="ar" lang="ar">عاداتي</span></div>
    <div class="top-actions">
      <a class="btn" href="/">← Mon tableau</a>
      <button id="themeBtn" class="btn icon" title="Jour / nuit" aria-label="Changer le thème">☾</button>
    </div>
  </header>
  <svg class="frieze" aria-hidden="true"><rect width="100%" height="100%" fill="url(#zellige)"/></svg>

  <div class="page">
    <main class="sheet" id="adminView" hidden>
      <section class="admin-head">
        <div class="box">
          <h1>Administration</h1>
          <p class="muted">Les comptes et leur activité. Seulement des chiffres : les notes, l'humeur et le poids de chacun restent privés.</p>
        </div>
        <div class="box goal-box">
          <div class="goal-row"><span>Comptes</span><strong id="statUsers"></strong></div>
          <div class="goal-row"><span>Nouveaux (7 jours)</span><strong id="statNew" class="pen"></strong></div>
          <div class="goal-row"><span>Connectés (7 jours)</span><strong id="statActive"></strong></div>
          <div class="goal-row"><span>Cases cochées</span><strong id="statDone" class="pen"></strong></div>
        </div>
      </section>

      <section class="box">
        <div class="table-tools">
          <h2>Comptes</h2>
          <input id="search" type="search" placeholder="Chercher un nom…" aria-label="Chercher un nom">
        </div>
        <div class="table-scroll">
          <table class="admin-table" id="usersTable"></table>
        </div>
      </section>

      <svg class="frieze" aria-hidden="true"><rect width="100%" height="100%" fill="url(#zellige)"/></svg>
    </main>

    <!-- accès refusé / non connecté -->
    <section class="auth" id="deniedView" hidden>
      <div class="auth-card">
        <h1>Accès réservé</h1>
        <p class="muted" id="deniedText"></p>
        <a class="btn primary" href="/">Retour au tableau</a>
      </div>
    </section>
  </div>

  <div id="toast" role="status"></div>
  <script src="admin.js"></script>
</body>
</html>
