# Configuration Render (Blueprint) : un service web Node.js gratuit
services:
  - type: web
    name: habit-tracker
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true   # Render crée une valeur secrète aléatoire
      - key: DATABASE_URL
        sync: false           # à coller depuis Neon au moment de la création
